name: Selenium Test

on:
  push:
    branches: [ "main", "ci-test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # - uses: actions/checkout@v3

      # - uses: actions/setup-node@v3
      #   with:
      #     node-version: 20

      # - name: Install dependencies
      #   run: npm install
      #   working-directory: my-app

      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1

      # - name: Run Selenium Test
      #   run: node tests/auth/login.test.js tests/post/post.test.js tests/logout/logout.test.js
      #   working-directory: my-app


      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          set -e
          rm -rf ~/.ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Copy project to VM and run tests
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} << 'EOF'
            set -e
            rm -rf ~/social-media
            mkdir -p ~/social-media
          EOF
          
          scp -r my-app ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/social-media/
          
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} << 'EOF'
          set -e

          echo "===== START VM ====="

          echo "Current dir:"
          pwd

          echo "Home content:"
          ls -la ~

          echo "Check social-media folder:"
          ls -la ~/social-media || echo "NO social-media"

          echo "Check my-app folder:"
          ls -la ~/social-media/my-app || echo "NO my-app"

          echo "===== CD ====="
          cd ~/social-media/my-app || exit 1

          echo "===== INSTALL ====="
          npm install || exit 1

          echo "===== RUN TEST ====="
          node tests/auth/login.test.js || exit 1

          echo "===== DONE ====="
          EOF