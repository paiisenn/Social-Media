name: Selenium Test

on:
  push:
    branches: [ "main", "ci-test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # - uses: actions/checkout@v3

      # - uses: actions/setup-node@v3
      #   with:
      #     node-version: 20

      # - name: Install dependencies
      #   run: npm install
      #   working-directory: my-app

      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1

      # - name: Run Selenium Test
      #   run: node tests/auth/login.test.js tests/post/post.test.js tests/logout/logout.test.js
      #   working-directory: my-app


      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Fix newline issues
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          
          # Verify key format
          if ! grep -q "BEGIN RSA PRIVATE KEY\|BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_rsa; then
            echo "❌ SSH key format invalid"
            head -c 100 ~/.ssh/id_rsa
            exit 1
          fi
          
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts 2>&1
          
          echo "✅ SSH setup complete"

      - name: Test SSH connection
        run: |
          echo "🔗 Testing SSH connection..."
          timeout 10 ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "echo '✅ SSH Connected' && uname -a" || {
            echo "❌ SSH connection failed"
            exit 1
          }

      - name: Deploy and run tests
        run: |
          HOST="${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}"
          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10"
          
          echo "📤 Copying project..."
          timeout 30 scp -r $SSH_OPTS my-app $HOST:~/social-media/ || {
            echo "❌ SCP failed"
            exit 1
          }
          echo "✅ Files copied"
          
          echo "🧪 Running test on VM..."
          timeout 60 ssh $SSH_OPTS $HOST << 'EOF'
          set -e
          
          echo "===== START VM ====="
          pwd
          ls -la ~/social-media/my-app || exit 1
          
          echo "===== INSTALL ====="
          cd ~/social-media/my-app
          npm install --prefer-offline --no-audit || exit 1
          
          echo "===== RUN TEST ====="
          node tests/auth/login.test.js || exit 1
          
          echo "===== DONE ====="
          EOF