name: Selenium Test

on:
  push:
    branches: [ "main", "ci-test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # - uses: actions/checkout@v3

      # - uses: actions/setup-node@v3
      #   with:
      #     node-version: 20

      # - name: Install dependencies
      #   run: npm install
      #   working-directory: my-app

      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1

      # - name: Run Selenium Test
      #   run: node tests/auth/login.test.js tests/post/post.test.js tests/logout/logout.test.js
      #   working-directory: my-app


      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH with base64
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Decode base64 SSH key (tránh newline issues)
          echo "${{ secrets.GCP_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa 2>/dev/null || \
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          
          # Verify key
          if grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/id_rsa; then
            echo "✅ SSH key OK"
          else
            echo "❌ SSH key invalid"
            file ~/.ssh/id_rsa
            exit 1
          fi
          
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts 2>&1
          echo "✅ SSH setup complete"

      - name: Test SSH connection
        run: |
          timeout 15 ssh -i ~/.ssh/id_rsa -v -o StrictHostKeyChecking=no \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "echo '✅ Connected' && whoami" || {
            echo "❌ SSH failed"
            exit 1
          }

      - name: Deploy and run tests
        run: |
          HOST="${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}"
          SSH_KEY=~/.ssh/id_rsa
          
          echo "📤 Syncing project..."
          rsync -avz -e "ssh -i $SSH_KEY -o StrictHostKeyChecking=no" \
            --delete my-app/ $HOST:~/social-media/my-app/ || {
            echo "❌ rsync failed, trying scp..."
            timeout 30 scp -r -i $SSH_KEY -o StrictHostKeyChecking=no \
              my-app $HOST:~/social-media/ || exit 1
          }
          echo "✅ Project synced"
          
          echo "🧪 Running tests..."
          ssh -i $SSH_KEY -o StrictHostKeyChecking=no $HOST << 'EOF'
          set -e
          cd ~/social-media/my-app
          echo "📂 Directory: $(pwd)"
          echo "📦 Installing..."
          npm ci --legacy-peer-deps || exit 1
          echo "🧪 Testing..."
          node tests/auth/login.test.js || exit 1
          echo "✅ All done!"
          EOF