name: Selenium Test

on:
  push:
    branches: [ "main", "ci-test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # - uses: actions/checkout@v3

      # - uses: actions/setup-node@v3
      #   with:
      #     node-version: 20

      # - name: Install dependencies
      #   run: npm install
      #   working-directory: my-app

      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1

      # - name: Run Selenium Test
      #   run: node tests/auth/login.test.js tests/post/post.test.js tests/logout/logout.test.js
      #   working-directory: my-app


      - uses: actions/checkout@v3

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}
      - name: Check VM status
        run: |
          echo "🔍 Checking VM..."
          if ! timeout 5 ping -c 1 ${{ secrets.GCP_VM_IP }} &> /dev/null; then
            echo "❌ VM không respond, cần restart"
            exit 1
          fi
          echo "✅ VM sống"

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "echo '✅ SSH Connected' && whoami"

      - name: Copy files
        run: |
          scp -o StrictHostKeyChecking=no -r my-app \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/social-media/

      - name: Run test
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "cd ~/social-media/my-app && npm install && node tests/auth/login.test.js"